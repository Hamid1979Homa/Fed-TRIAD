name: Validate reproduction on hosted runners

on:
  push:
    branches: [kais-reproduction-audit]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      BLIS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13.5"
      - name: Install the checksummed wheels
        run: python -m pip install --only-binary=:all: --require-hashes -r requirements-lock.txt
      - name: Record the numerical environment
        run: python -c "import platform, scipy, sklearn, numpy; print(platform.platform()); numpy.show_runtime()"
      - name: Independent first-round, gradient and audit tests
        run: python -m unittest discover -s tests -v
      - name: Numerical checks for the theory
        run: python src/theory_checks.py
      - name: Recompute historical seed 1 and change one parameter
        run: python src/test_sim.py reference/drift_m12_first_study_seeds1-5.npy
